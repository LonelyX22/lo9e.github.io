name: Train experimental CCSN cloud baseline

on:
  push:
    branches: ["main"]
    paths:
      - "ai/scripts/**"
      - "ai/requirements.txt"
      - ".github/workflows/train-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cloud-model-baseline
  cancel-in-progress: true

jobs:
  train-baseline:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install Pillow numpy scikit-learn pandas matplotlib tqdm onnx onnxruntime onnxscript requests datasets
      - name: Download CCSN from Harvard Dataverse
        run: python ai/scripts/download_ccsn.py
      - name: Prepare research baseline splits
        run: python ai/scripts/prepare_dataset.py --input ai/dataset/raw --output ai/dataset/processed --seed 42 --min-per-class 10
      - name: Train experimental 10-genus baseline
        run: python ai/scripts/train.py --data ai/dataset/processed --output ai/artifacts --epochs 20 --freeze-epochs 3 --image-size 224 --batch-size 16 --lr 8e-5
      - name: Evaluate untouched test split
        run: python ai/scripts/evaluate.py --data ai/dataset/processed --checkpoint ai/artifacts/best.pt --output ai/artifacts/evaluation
      - name: Check model release gate
        id: release_gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          meta=json.loads(Path("ai/artifacts/model_metadata.json").read_text())
          status=meta.get("status","research_only")
          print(f"Model release status: {status}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("status="+status+"\n")
          PY
      - name: Copy model into public site only when validated
        if: contains(fromJSON('["validated","beta"]'), steps.release_gate.outputs.status)
        run: |
          mkdir -p models/cloud-classifier
          cp ai/artifacts/model.onnx models/cloud-classifier/model.onnx
          cp ai/artifacts/model_metadata.json models/cloud-classifier/model_metadata.json
      - name: Upload validated site for Pages
        if: steps.release_gate.outputs.status == 'validated'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy validated model to GitHub Pages
        if: steps.release_gate.outputs.status == 'validated'
        uses: actions/deploy-pages@v4
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccsn-experimental-baseline
          path: |
            ai/artifacts/
            ai/dataset/processed/dataset_report.json
            ai/dataset/downloads/ccsn/download_manifest.json
          retention-days: 30
