name: Deploy Cloud Scanner AI Pro V2 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest successful cloud model artifact
        id: latest_model
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "train-baseline.yml",
              status: "success",
              per_page: 100
            });
            for (const run of runs.sort((a,b) => new Date(b.created_at) - new Date(a.created_at))) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              });
              const artifact = artifacts.find(a => a.name === "ccsn-experimental-baseline" && !a.expired);
              if (artifact) {
                core.setOutput("run_id", String(run.id));
                core.setOutput("artifact_id", String(artifact.id));
                core.info(`Using model artifact from training run ${run.id}`);
                return;
              }
            }
            core.setFailed("No successful, non-expired cloud model artifact was found.");

      - name: Download latest completed experimental CCSN model
        uses: actions/download-artifact@v4
        with:
          name: ccsn-experimental-baseline
          run-id: ${{ steps.latest_model.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/ccsn-artifact

      - name: Install beta model for public testing
        run: |
          set -euo pipefail
          mkdir -p models/cloud-classifier
          cp /tmp/ccsn-artifact/artifacts/model.onnx models/cloud-classifier/model.onnx
          cp /tmp/ccsn-artifact/artifacts/model_metadata.json models/cloud-classifier/model_metadata.json
          test -s models/cloud-classifier/model.onnx
          export MODEL_RUN_ID="${{ steps.latest_model.outputs.run_id }}"
          python - <<'PY'
          import json, os
          p="models/cloud-classifier/model_metadata.json"
          with open(p, encoding="utf-8") as f: m=json.load(f)
          assert m.get("status") in ("beta", "validated"), f"Unsupported model status: {m.get('status')!r}"
          m["model_version"] = os.environ["MODEL_RUN_ID"]
          with open(p, "w", encoding="utf-8") as f: json.dump(m, f, indent=2)
          print("Installed cloud model:", m.get("status"), m.get("test_metrics"), "version", m["model_version"])
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website with beta model
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy beta model to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
